<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Badge Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-weight: bold;
            color: #333;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group input,
        .control-group select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .preview-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        .preview-label {
            font-weight: bold;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }

        #badgePreview {
            width: 360px;
            height: 580px;
            background: transparent;
            border-radius: 10px;
            border: none;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .badge {
            width: 100%;
            height: 100%;
            background-image: url('volunteercommon.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0;
            color: #333;
        }

        .badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.02);
            pointer-events: none;
        }

        .badge-header {
            display: none;
        }

        .badge-logo {
            display: none;
        }

        .badge-title {
            display: none;
        }

        .badge-subtitle {
            display: none;
        }

        .badge-content {
            position: absolute;
            z-index: 1;
            bottom: 110px;
            left: 0;
            right: 0;
            text-align: center;
            width: 100%;
        }

        .badge-name {
            font-size: 24px;
            font-weight: bold;
            color: #000;
            word-wrap: break-word;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
            margin: 0;
        }

        .badge-label {
            display: none;
        }

        .badge-date {
            display: none;
        }

        .badge-footer {
            display: none;
        }

        .badge-volunteer {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <h1 style="margin-bottom: 20px; color: #333;">Badge Generator</h1>

            <div class="control-group">
                <label for="nameInput">Custom Name</label>
                <input type="text" id="nameInput" placeholder="Enter volunteer name" value="Your Name">
            </div>

            <div class="button-group">
                <button class="btn-download" onclick="downloadBadge()">Download as JPG</button>
                <button class="btn-reset" onclick="resetForm()">Reset</button>
            </div>
        </div>

        <div class="preview-section">
            <div class="preview-label">Preview</div>
            <div id="badgePreview">
                <div class="badge" id="badge">
                    <div class="badge-header">
                        <div class="badge-logo" id="logoText">IEEE ENTREPRENEURSHIP</div>
                        <div class="badge-title" id="titleText">VOLUNTEER</div>
                        <div class="badge-subtitle" id="eventText">GALGOTIAS SUMMIT</div>
                    </div>

                    <div class="badge-content">
                        <div class="badge-name" id="nameText">Your Name</div>
                        <div class="badge-label" id="labelText">VOLUNTEER</div>
                    </div>

                    <div class="badge-footer">
                        <div class="badge-volunteer" id="volunteerText">VOLUNTEER</div>
                        <div class="badge-date" id="dateText">17 & 18 SEPTEMBER</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Update badge name in real-time
        document.getElementById('nameInput').addEventListener('input', function() {
            document.getElementById('nameText').textContent = this.value.toUpperCase() || 'Your Name';
        });

        function downloadBadge() {
            const badge = document.getElementById('badge');
            const nameInput = document.getElementById('nameInput').value || 'badge';

            html2canvas(badge, {
                scale: 2,
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                // Convert to JPG
                const link = document.createElement('a');
                link.download = `${nameInput}_badge.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
            });
        }

        function resetForm() {
            document.getElementById('nameInput').value = 'Your Name';
            document.getElementById('nameText').textContent = 'Your Name';
        }
    </script>
</body>
</html>
